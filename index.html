<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>360° VR Gallery</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin/index.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/gallery-plugin/index.min.css" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  body {
    color: #fff;
    font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    min-height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: 100px;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-auto-rows: calc((100vh - 4px) / 2);  /* 1행 = 화면 절반, 2행이면 꽉 참, 더 올리면 스크롤 */
    gap: 4px;
    width: 100vw;
  }
  .card {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    background: #0a0a0a;
    transition: transform 0.25s ease;
  }
  .card:hover { transform: scale(1.015); z-index: 2; }

  .card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    filter: grayscale(100%) brightness(0.95);
    transition: filter 0.35s ease;
  }
  .card:hover img { filter: grayscale(0%) brightness(1.05); }

  .card .label {
    position: absolute;
    bottom: 14px;
    left: 16px;
    font-size: 14px;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    z-index: 2;
  }
  .card .label .count {
    margin-left: 8px;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(4px);
    vertical-align: middle;
  }
  .card .delete-btn {
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    border: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s, background 0.2s;
    z-index: 3;
  }
  .card:hover .delete-btn { opacity: 1; }
  .card .delete-btn:hover { background: rgba(220,50,50,0.9); }

  .viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 1000;
  }
  .viewer.active { display: block; }
  #psv-container { width: 100%; height: 100%; }

  .viewer-title-bar {
    position: absolute;
    top: 0; left: 0;
    padding: 20px 30px;
    z-index: 100;
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
  }

  /* 우상단 컨트롤 (닫기 + 줌/회전/정렬) */
  .top-right-controls {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 4px;
    z-index: 100;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    padding: 6px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .ctrl-btn {
    background: transparent;
    border: none;
    color: #fff;
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
    font-family: inherit;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.15); }
  .ctrl-btn.active { background: rgba(74, 222, 128, 0.3); color: #4ade80; }
  .ctrl-btn.close-btn-x { color: #fff; }
  .ctrl-btn.close-btn-x:hover { background: rgba(220,50,50,0.7); }

  .viewer-hint {
    position: absolute;
    bottom: 20px; right: 30px;
    color: rgba(255,255,255,0.45);
    font-size: 12px;
    z-index: 100;
    pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
  }

  .viewer-error {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #ff6b6b;
    font-size: 14px;
    z-index: 50;
    padding: 40px;
    text-align: center;
    white-space: pre-wrap;
  }
  .viewer-error.show { display: flex; }

  .upload-btn {
    position: fixed;
    bottom: 30px; left: 30px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 500;
    font-family: inherit;
  }
  .upload-btn:hover { background: rgba(255,255,255,0.18); }
  .upload-btn .dot-indicator { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; }
  #fileInput { display: none; }

  .clear-btn {
    position: fixed;
    bottom: 30px;
    left: 220px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.6);
    padding: 12px 18px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    z-index: 500;
    font-family: inherit;
    display: none;
  }
  .clear-btn.show { display: block; }
  .clear-btn:hover { color: #fff; background: rgba(220,50,50,0.3); }

  .toast {
    position: fixed;
    bottom: 100px; left: 30px;
    background: rgba(20,20,20,0.95);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 12px;
    z-index: 600;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
    max-width: 360px;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  .psv-navbar { display: none !important; }

  /* 바닥 핫스팟(3D 화살표) 투명하게 - 호버 시 진하게 */
  .psv-virtual-tour-arrow {
    opacity: 0.35 !important;
    transition: opacity 0.25s ease;
  }
  .psv-virtual-tour-arrow:hover {
    opacity: 1 !important;
  }
  /* Three.js 렌더된 3D 메시 화살표용 (canvas 내부) - 색상 조정 */

  /* ===== 반응형 갤러리 (웹 5칸 / 태블릿 3칸 / 폰 2칸) ===== */
  @media (max-width: 1100px) {
    .gallery {
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 36vh;
    }
  }
  @media (max-width: 640px) {
    .gallery {
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: 30vh;
    }
  }

  /* ===== 모바일 뷰어 대응 ===== */
  @media (max-width: 768px) {
    /* 아래쪽 힌트 글씨 숨김 (모바일은 터치라 안내 불필요) */
    .viewer-hint { display: none; }

    /* 우상단 메뉴 크기 줄이고 위치 정리 */
    .top-right-controls {
      top: 10px;
      right: 10px;
      gap: 2px;
      padding: 4px;
    }
    .ctrl-btn {
      width: 30px;
      height: 30px;
      font-size: 14px;
    }
  }
</style>
</head>
<body>

<div class="gallery" id="gallery"></div>

<div class="viewer" id="viewer">
  <div id="psv-container"></div>
  <div class="viewer-error" id="viewerError"></div>

  <div class="viewer-title-bar">
    <span id="viewerTitle">-</span>
  </div>

  <!-- 우상단 통합 컨트롤 -->
  <div class="top-right-controls">
    <button class="ctrl-btn" onclick="window.zoomIn()" title="줌 인">+</button>
    <button class="ctrl-btn" onclick="window.zoomOut()" title="줌 아웃">−</button>
    <button class="ctrl-btn active" id="autoRotateBtn" onclick="window.toggleAutoRotate()" title="자동 회전">↻</button>
    <button class="ctrl-btn" onclick="window.resetView()" title="정렬">⌂</button>
    <button class="ctrl-btn close-btn-x" onclick="window.closeViewer()" title="닫기">✕</button>
  </div>

  <div class="viewer-hint">⊕ 드래그하여 둘러보기 · 휠로 줌 · 바닥 화살표 클릭해 이동</div>
</div>

<button class="upload-btn" onclick="document.getElementById('fileInput').click()">
  <span class="dot-indicator"></span>
  ⬆ 프로젝트 업로드 (여러 장 = 한 집)
</button>
<input type="file" id="fileInput" accept="image/*" multiple />

<button class="clear-btn" id="clearBtn">모두 지우기</button>

<div class="toast" id="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
    "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.module.js",
    "@photo-sphere-viewer/markers-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.module.js",
    "@photo-sphere-viewer/virtual-tour-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin/index.module.js",
    "@photo-sphere-viewer/autorotate-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/autorotate-plugin/index.module.js",
    "@photo-sphere-viewer/gallery-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/gallery-plugin/index.module.js"
  }
}
</script>

<script type="module">
let Viewer, MarkersPlugin, VirtualTourPlugin, AutorotatePlugin, GalleryPlugin;
let libsReady = false;
let libLoadError = null;

try {
  const core = await import('@photo-sphere-viewer/core');
  const markers = await import('@photo-sphere-viewer/markers-plugin');
  const tour = await import('@photo-sphere-viewer/virtual-tour-plugin');
  const autorot = await import('@photo-sphere-viewer/autorotate-plugin');
  const gal = await import('@photo-sphere-viewer/gallery-plugin');

  Viewer = core.Viewer;
  MarkersPlugin = markers.MarkersPlugin;
  VirtualTourPlugin = tour.VirtualTourPlugin;
  AutorotatePlugin = autorot.AutorotatePlugin;
  GalleryPlugin = gal.GalleryPlugin;

  libsReady = true;
} catch (e) {
  libLoadError = e.message || String(e);
  console.error("PSV library load failed:", e);
}

/* ============================================================
   IndexedDB 저장 (대용량 이미지 영구 저장)
============================================================ */
const DB_NAME = "vr_gallery_db";
const DB_VERSION = 2;
const STORE_NAME = "projects";

let dbInstance = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (dbInstance) return resolve(dbInstance);
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "id" });
      }
    };
    req.onsuccess = (e) => {
      dbInstance = e.target.result;
      resolve(dbInstance);
    };
    req.onerror = (e) => {
      console.error("[db] open fail", e);
      reject(e);
    };
  });
}

async function loadFromStorage() {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();
      req.onsuccess = () => {
        const items = req.result || [];
        console.log("[db] loaded", items.length, "items");
        resolve(items);
      };
      req.onerror = () => {
        console.error("[db] load fail");
        resolve([]);
      };
    });
  } catch (e) {
    console.error("[db] load fail", e);
    return [];
  }
}

async function saveOne(scene) {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      const store = tx.objectStore(STORE_NAME);
      store.put(scene);
      tx.oncomplete = () => {
        console.log("[db] saved 1 item:", scene.id);
        resolve();
      };
      tx.onerror = (e) => {
        console.error("[db] save fail", e);
        reject(e);
      };
    });
  } catch (e) {
    console.error("[db] save fail", e);
    showToast("저장 실패: " + e.message);
  }
}

async function deleteOne(id) {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).delete(id);
      tx.oncomplete = () => {
        console.log("[db] deleted:", id);
        resolve();
      };
    });
  } catch (e) {
    console.error("[db] delete fail", e);
  }
}

async function clearStorage() {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).clear();
      tx.oncomplete = () => {
        console.log("[db] cleared all");
        resolve();
      };
    });
  } catch (e) {
    console.error("[db] clear fail", e);
  }
}

let uploadedProjects = await loadFromStorage();

/* ============================================================
   기본 프로젝트 (영구 코드)
   - 프로젝트 1개 = 집 1채(또는 한 묶음).  title = 프로젝트명(직접 수정 가능)
   - scenes[] = 그 프로젝트 안의 360° 공간들
   - scenes[].links = 같은 프로젝트 안에서 바닥 화살표로 이동
        nodeId = 이동할 씬 id,  yaw = 화살표 방향(0~360deg),  pitch = 아래로 기운 정도(보통 -30deg)
============================================================ */
const baseProjects = [
  {
    id: "proj_10",
    title: "테스트",                   // ← 프로젝트명 (원하는 이름으로 바꾸세요)
    scenes: [
      { id: "s_10_1", title: "공간 1", panorama: "p10-1.jpg", thumb: "p10-1.jpg",
        links: [ { nodeId: "s_10_2", position: { yaw: "90deg",  pitch: "-30deg" } } ] },
      { id: "s_10_2", title: "공간 2", panorama: "p10-2.jpg", thumb: "p10-2.jpg",
        links: [ { nodeId: "s_10_1", position: { yaw: "270deg", pitch: "-30deg" } } ] },
    ]
  },
  {
    id: "proj_sample",
    title: "샘플 모델하우스",          // ← 프로젝트명 (원하는 이름으로 바꾸세요)
    scenes: [
      { id: "s_p1",  title: "거실 A", panorama: "p-1.jpg",   thumb: "p-1.jpg",
        links: [ { nodeId: "s_p21", position: { yaw: "90deg",  pitch: "-30deg" } } ] },
      { id: "s_p21", title: "주방",   panorama: "p-2-1.jpg", thumb: "p-2-1.jpg",
        links: [ { nodeId: "s_p1",  position: { yaw: "270deg", pitch: "-30deg" } } ] },
    ]
  },
  {
    id: "proj_b",
    title: "프로젝트 B",
    scenes: [
      { id: "s_p2", title: "거실 B", panorama: "p-2.jpg", thumb: "p-2.jpg", links: [] },
      { id: "s_p3", title: "침실",   panorama: "p-3.jpg", thumb: "p-3.jpg", links: [] },
    ]
  },
  {
    id: "proj_hall",
    title: "분양홍보관",
    scenes: [
      { id: "s_p4", title: "엔트런스", panorama: "p-4.jpg", thumb: "p-4.jpg", links: [] },
      { id: "s_p5", title: "라운지",   panorama: "p-5.jpg", thumb: "p-5.jpg", links: [] },
    ]
  },
];

function getAllProjects() {
  return [...baseProjects, ...uploadedProjects];
}

/* ============================================================
   갤러리 렌더링
============================================================ */
function renderGallery() {
  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";
  const all = getAllProjects();

  all.forEach(project => {
    const cover = project.scenes[0];
    const thumbSrc = cover ? (cover.thumb || cover.panorama) : "";
    const isUploaded = project.id.startsWith("proj_upload_");
    const count = project.scenes.length;

    const card = document.createElement("div");
    card.className = "card";
    card.onclick = (e) => {
      if (e.target.classList.contains("delete-btn")) return;
      openViewer(project.id);
    };

    card.innerHTML = `
      <img src="${thumbSrc}" alt="${project.title}" />
      ${isUploaded ? `<button class="delete-btn" data-id="${project.id}">✕</button>` : ""}
      <div class="label">${project.title}<span class="count">${count}컷</span></div>
    `;
    gallery.appendChild(card);
  });

  gallery.querySelectorAll(".delete-btn").forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      if (!confirm("이 프로젝트를 삭제할까요?")) return;
      uploadedProjects = uploadedProjects.filter(p => p.id !== id);
      await deleteOne(id);
      renderGallery();
    };
  });

  const clearBtn = document.getElementById("clearBtn");
  clearBtn.classList.toggle("show", uploadedProjects.length > 0);
}

/* VR 뷰어 */
let psv = null;
let isAutoRotating = true;

function openViewer(projectId) {
  const project = getAllProjects().find(p => p.id === projectId);
  if (!project || !project.scenes.length) return;

  const scenes = project.scenes;
  const startSceneId = scenes[0].id;

  document.getElementById("viewer").classList.add("active");
  document.getElementById("viewerTitle").textContent = project.title + " · " + scenes[0].title;
  document.getElementById("viewerError").classList.remove("show");

  if (!libsReady) {
    const errEl = document.getElementById("viewerError");
    errEl.textContent = "VR 라이브러리 로드 실패\n" + (libLoadError || "");
    errEl.classList.add("show");
    return;
  }

  // 이 프로젝트 안의 공간들만 투어 노드로 (바닥 화살표 + 갤러리 띠로 이동)
  const nodes = scenes.map(s => {
    return {
      id: s.id,
      panorama: s.panorama,
      thumbnail: s.thumb || s.panorama,
      name: s.title,
      caption: project.title + " · " + s.title,
      links: s.links || [],
      gallery: true
    };
  });

  if (psv) {
    try { psv.destroy(); } catch (e) {}
    psv = null;
  }

  // 모바일(세로 화면)에서는 더 넓게 보이도록 줌/FOV 조정
  const isMobile = window.matchMedia("(max-width: 768px)").matches;
  const startZoom = isMobile ? 0 : 30;   // 0 = 가장 넓게(줌아웃)
  const maxFovVal = isMobile ? 110 : 100;

  try {
    psv = new Viewer({
      container: document.getElementById("psv-container"),
      plugins: [
        MarkersPlugin,
        AutorotatePlugin.withConfig({
          autorotateSpeed: "0.8rpm",
          autostartDelay: 1000,
          autostartOnIdle: false
        }),
        VirtualTourPlugin.withConfig({
          positionMode: 'manual',
        }),
      ],
      defaultZoomLvl: startZoom,
      minFov: 20,
      maxFov: maxFovVal,
      navbar: false,
    });

    const tourPlugin = psv.getPlugin(VirtualTourPlugin);
    tourPlugin.setNodes(nodes, startSceneId);

    const ar = psv.getPlugin(AutorotatePlugin);
    setTimeout(() => {
      ar.start();
      isAutoRotating = true;
      document.getElementById("autoRotateBtn").classList.add("active");
    }, 1000);

    tourPlugin.addEventListener('node-changed', ({ node }) => {
      document.getElementById("viewerTitle").textContent = project.title + " · " + (node.name || node.id);
    });
  } catch (e) {
    console.error("뷰어 생성 실패:", e);
    const errEl = document.getElementById("viewerError");
    errEl.textContent = "뷰어 생성 실패: " + e.message;
    errEl.classList.add("show");
  }
}

function closeViewer() {
  document.getElementById("viewer").classList.remove("active");
  if (psv) {
    try { psv.destroy(); } catch (e) {}
    psv = null;
  }
}

window.zoomIn = () => {
  if (!psv) return;
  psv.zoom(psv.getZoomLevel() + 10);
};
window.zoomOut = () => {
  if (!psv) return;
  psv.zoom(psv.getZoomLevel() - 10);
};
window.toggleAutoRotate = () => {
  if (!psv || !libsReady) return;
  const ar = psv.getPlugin(AutorotatePlugin);
  if (isAutoRotating) {
    ar.stop();
    isAutoRotating = false;
    document.getElementById("autoRotateBtn").classList.remove("active");
  } else {
    ar.start();
    isAutoRotating = true;
    document.getElementById("autoRotateBtn").classList.add("active");
  }
};
window.resetView = () => {
  if (!psv) return;
  const isMobile = window.matchMedia("(max-width: 768px)").matches;
  psv.animate({ yaw: 0, pitch: 0, zoom: isMobile ? 0 : 30, speed: '2rpm' });
};
window.closeViewer = closeViewer;

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeViewer();
});

/* 업로드 */
function handleUpload(event) {
  // 한 프로젝트(집)로 묶을 파노라마들을 한 번에 선택해서 업로드
  const files = Array.from(event.target.files).filter(f => f.type.startsWith("image/"));
  if (files.length === 0) { event.target.value = ""; return; }

  // 프로젝트명 직접 입력
  const projTitle = prompt("프로젝트 이름을 입력하세요 (예: OO아파트 84A)", "새 프로젝트");
  if (projTitle === null) { event.target.value = ""; return; }   // 취소

  const projId = "proj_upload_" + Date.now();
  showToast(`"${projTitle}" · ${files.length}장 변환 중...`);

  const scenes = new Array(files.length);   // 선택 순서 유지
  let processed = 0;

  files.forEach((file, idx) => {
    const reader = new FileReader();
    reader.onload = async (e) => {
      scenes[idx] = {
        id: projId + "_s" + idx,
        title: file.name.replace(/\.[^.]+$/, ""),
        panorama: e.target.result,
        thumb: e.target.result,
        links: []
      };
      processed++;

      if (processed === files.length) {
        const project = {
          id: projId,
          title: projTitle.trim() || "새 프로젝트",
          scenes: scenes
        };
        uploadedProjects.push(project);
        await saveOne(project);
        renderGallery();
        showToast(`"${project.title}" 추가됨 (${files.length}컷) · 새로고침해도 유지됨`);
      }
    };
    reader.onerror = () => {
      processed++;
      if (processed === files.length) renderGallery();
    };
    reader.readAsDataURL(file);
  });

  event.target.value = "";
}

async function clearAll() {
  if (!confirm("업로드한 모든 프로젝트를 삭제할까요?")) return;
  uploadedProjects = [];
  await clearStorage();
  renderGallery();
  showToast("모두 삭제됨");
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}

document.getElementById("fileInput").addEventListener("change", handleUpload);
document.getElementById("clearBtn").addEventListener("click", clearAll);

renderGallery();

if (!libsReady) {
  showToast("VR 라이브러리 로딩 실패");
}
</script>
